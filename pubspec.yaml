name: biocycle_ai
description: IoT and AI-powered waste analysis and composting recommendation app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # AI/ML
  tflite_flutter: ^0.11.0
  image: ^4.1.3

  # HTTP Client
  dio: ^5.4.0
  
  # AI - Gemini
  google_generative_ai: ^0.2.2

  # Connectivity
  connectivity_plus: ^4.0.2

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Image Picker
  image_picker: ^1.0.7
  permission_handler: ^11.2.0

  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/data/
    - assets/images/

